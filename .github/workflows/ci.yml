name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Ubuntu (Python 3.12)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests cryptography pycryptodome tplinkrouterc6u mcp

    - name: Run unit tests
      run: |
        python -m unittest discover tests

    - name: Validate web schemas and build portals
      run: |
        python web/scripts/build.py
